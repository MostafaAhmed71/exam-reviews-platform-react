# Netlify configuration file
# This file should be in the root directory

[build]
  command = "npm run build"
  publish = "dist"

# Security Headers (alternative to _headers file)
# Note: If _headers file exists, it takes precedence
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://northelite0.com; frame-src 'self' https://www.youtube.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
    
    # X-Frame-Options - Protect against Clickjacking
    X-Frame-Options = "SAMEORIGIN"
    
    # X-Content-Type-Options - Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # X-XSS-Protection - Enable XSS filter
    X-XSS-Protection = "1; mode=block"
    
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions Policy (formerly Feature Policy)
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

